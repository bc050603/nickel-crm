<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>镍圈客户簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with three views (跟进 / 客户 / 情报); records open in a side sheet (full screen on phones) */
:root {
  --bg: #f3f5f5;
  --surface: #fcfdfd;
  --sunken: #eaeeee;
  --ink: #11191c;
  --ink-2: #4a5558;
  --muted: #7b8588;
  --line: #dde2e3;
  --accent: #0b7a66;
  --accent-ink: #ffffff;
  --accent-wash: rgba(11,122,102,.09);
  --tA: #184f95; --tB: #2a78d6; --tC: #86b6ef; --tD: #cdd3d4;
  --tA-ink: #ffffff; --tB-ink: #ffffff; --tC-ink: #11191c; --tD-ink: #11191c;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b; --none: #a3abad;
  --overdue-wash: rgba(208,59,59,.08);
  --scrim: rgba(17,25,28,.38);
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1314; --surface: #151c1e; --sunken: #1b2427; --ink: #e8eded; --ink-2: #b3bec0; --muted: #808b8e; --line: #263033;
    --accent: #3cbfa4; --accent-ink: #0e1314; --accent-wash: rgba(60,191,164,.12);
    --tA: #b7d3f6; --tB: #5598e7; --tC: #256abf; --tD: #3a4447;
    --tA-ink: #0e1314; --tB-ink: #0e1314; --tC-ink: #e8eded; --tD-ink: #e8eded;
    --overdue-wash: rgba(230,103,103,.12); --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 18px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { font: 700 19px/1 var(--f-display); letter-spacing: .02em; white-space: nowrap; }
.brand small { font: 500 11px var(--f-data); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { background: var(--accent-wash); color: var(--ink); }
.tab .badge { font: 500 11px var(--f-data); background: var(--critical); color: #fff; border-radius: 999px; padding: 0 6px; line-height: 17px; }
.bar .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; font-size: 13px; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
@media (max-width: 640px) {
  .bar-in { gap: 8px 10px; }
  .brand small { display: none; }
  .tabs { order: 3; width: 100%; }
  .tab { flex: 1; justify-content: center; }
}

/* main */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 96px; }
.view { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; min-width: 0; }
.vhead { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; justify-content: space-between; }
.vhead h2 { font: 700 22px/1.25 var(--f-display); }
.vhead p { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stat { display: grid; }
.stat .v { font: 500 22px/1.15 var(--f-data); }
.stat .l { font-size: 12px; color: var(--ink-2); }
.cadence { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
.cadence input { width: 46px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-align: center; font: 500 12px var(--f-data); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.toolbar .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 3px 10px; border-radius: 999px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); color: var(--ink); }
input[type="search"], input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="tel"], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: 13px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 64px; line-height: 1.55; }
input[type="search"] { width: min(260px, 100%); }

/* tier + pills */
.tier { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font: 600 12px var(--f-data); flex: none; }
.tier.A { background: var(--tA); color: var(--tA-ink); } .tier.B { background: var(--tB); color: var(--tB-ink); }
.tier.C { background: var(--tC); color: var(--tC-ink); } .tier.D { background: var(--tD); color: var(--tD-ink); }
.tier.sm { width: 18px; height: 18px; font-size: 10px; border-radius: 4px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.cat { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.due { font: 500 11px var(--f-data); padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.due.over { background: var(--overdue-wash); color: var(--critical); }
.due.today { background: var(--accent-wash); color: var(--accent); }
.due.soon { background: var(--sunken); color: var(--ink-2); }

/* follow-up cards */
.group { display: grid; gap: 10px; }
.group-h { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.group-h strong { color: var(--ink); font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card-top { display: flex; gap: 10px; align-items: center; min-width: 0; }
.card-top .who { min-width: 0; flex: 1; display: grid; }
.linkish { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; font-weight: 600; font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
.linkish:hover { color: var(--accent); }
.sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.card .nx { font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.soonlist { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.soonrow { display: flex; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 13px; min-width: 0; }
.soonrow:first-child { border-top: 0; }
.soonrow .linkish { font-size: 13px; }
.soonrow .sub { flex: 1; min-width: 0; }

/* contact list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row, .lhead { display: grid; grid-template-columns: 24px minmax(0,1.3fr) minmax(0,1.4fr) 7.5em 5.5em 6.2em 6.2em; gap: 12px; align-items: center; padding: 10px 14px; }
.row { border-top: 1px solid var(--line); cursor: pointer; font-size: 13px; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.row:first-of-type { border-top: 0; }
.row:hover { background: var(--accent-wash); }
.row .nm { font-weight: 600; overflow-wrap: anywhere; }
.row .co { color: var(--ink-2); overflow-wrap: anywhere; }
.row .r, .lhead .r { text-align: right; }
.lhead { padding-block: 9px; font-size: 11px; letter-spacing: .06em; color: var(--muted); background: var(--sunken); }
@media (max-width: 760px) {
  .lhead { display: none; }
  .row { grid-template-columns: 24px minmax(0,1fr); row-gap: 3px; }
  .row .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .row .r { text-align: left; }
}
@media (min-width: 761px) { .row .meta { display: contents; } }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; display: grid; gap: 10px; justify-items: center; }

/* intel */
.intel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.irow { display: grid; grid-template-columns: 6.4em 7.6em minmax(0,1fr) minmax(0, 11em); gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.irow:first-child { border-top: 0; }
.irow .d { font: 500 12px var(--f-data); color: var(--muted); }
.irow .c { overflow-wrap: anywhere; }
.irow .s { font-size: 12px; text-align: right; overflow-wrap: anywhere; }
.irow .s .linkish { font-size: 12px; font-weight: 500; color: var(--ink-2); }
@media (max-width: 760px) {
  .irow { grid-template-columns: auto auto minmax(0,1fr); row-gap: 4px; }
  .irow .c { grid-column: 1 / -1; }
}

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(600px, 100%); background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@media (max-width: 640px) { .sheet { border-left: 0; padding-left: env(safe-area-inset-left, 0px); } }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet-h h3 { flex: 1; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.sheet-b { overflow-y: auto; padding: 16px; display: grid; gap: 16px; align-content: start; flex: 1; }
.sec { display: grid; gap: 6px; min-width: 0; }
.sec > .lbl { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.sec > .val { overflow-wrap: anywhere; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px 18px; }
@media (max-width: 520px) { .pgrid { grid-template-columns: minmax(0,1fr); } }
.dhead { display: grid; gap: 8px; }
.dhead .t { display: flex; gap: 10px; align-items: center; }
.dhead h2 { font: 700 21px/1.25 var(--f-display); overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.ver { background: var(--accent-wash); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; display: grid; gap: 8px; }
.ver .btn { justify-self: start; }
.tl { display: grid; }
.tli { display: grid; grid-template-columns: 6.4em minmax(0,1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.tli:first-child { border-top: 0; }
.tli .d { font: 500 12px var(--f-data); color: var(--muted); }
.tli .k { font-size: 11px; color: var(--muted); margin-right: 6px; }
.copyable { user-select: all; font-family: var(--f-data); }

/* forms */
form { display: grid; gap: 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; color: var(--ink-2); }
.frow { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
@media (max-width: 520px) { .frow { grid-template-columns: minmax(0,1fr); } }
.radio { display: flex; flex-wrap: wrap; gap: 6px; }
.radio input { position: absolute; opacity: 0; pointer-events: none; }
.radio label { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.radio input:checked + label { border-color: var(--accent); background: var(--accent-wash); color: var(--ink); }
.radio input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.formfoot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.err { color: var(--critical); font-size: 12px; }
.hint { font-size: 12px; color: var(--muted); }

/* gate (setup / sign-in) */
.gate { min-height: 80vh; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px; }
.gate .box { width: min(400px, 100%); padding: 24px; gap: 14px; }
.gate h1 { font: 700 26px/1.2 var(--f-display); }
.gate ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }

/* banner, fab, toast */
.banner { max-width: 1120px; margin: 0 auto 14px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.fab { position: fixed; z-index: 25; right: max(16px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); box-shadow: 0 6px 18px rgba(0,0,0,.18); padding: 12px 18px; border-radius: 999px; font-size: 14px; }
@media (min-width: 761px) { .fab { display: none; } }
@media (max-width: 760px) { .bar .rec { display: none; } }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); }
.skeleton { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- setup / sign-in -->
<div class="gate" id="gate-setup" hidden>
  <div class="box">
    <h1>镍圈客户簿</h1>
    <p class="hint">还没连上 Supabase。按仓库里 README 的步骤建好项目，再把 config.js 里的地址和公开 key 填上。</p>
  </div>
</div>
<div class="gate" id="gate-auth" hidden>
  <form class="box" id="f-auth" novalidate>
    <h1>镍圈客户簿</h1>
    <p class="hint" id="auth-hint">登录后才能看到你的客户。</p>
    <div class="field"><label for="au-e">邮箱</label><input type="email" id="au-e" name="email" autocomplete="username" required></div>
    <div class="field"><label for="au-p">密码</label><input type="password" id="au-p" name="password" autocomplete="current-password" minlength="8" required></div>
    <p class="err" id="au-err" hidden></p>
    <div class="formfoot" style="justify-content:space-between">
      <button class="btn ghost" type="button" id="au-switch">第一次用？注册账号</button>
      <button class="btn primary" type="submit" id="au-go">登录</button>
    </div>
  </form>
</div>

<div id="app" hidden>
<header class="bar">
  <div class="bar-in">
    <div class="brand">镍圈客户簿<small>NPI · Ni · SS</small></div>
    <nav class="tabs" role="tablist" aria-label="视图">
      <button class="tab" role="tab" id="tab-due" aria-selected="true" data-view="due">跟进<span class="badge" id="due-badge" hidden></span></button>
      <button class="tab" role="tab" id="tab-contacts" aria-selected="false" data-view="contacts">客户</button>
      <button class="tab" role="tab" id="tab-intel" aria-selected="false" data-view="intel">情报</button>
    </nav>
    <span class="spacer"></span>
    <button class="btn primary rec" type="button" id="btn-rec-top">＋ 快速记录</button>
    <button class="btn ghost" type="button" id="btn-settings">设置</button>
  </div>
</header>

<main>
  <div class="banner" id="banner" hidden></div>

  <section class="view" id="view-due" aria-labelledby="tab-due">
    <div class="vhead">
      <div><h2>今天该联系谁</h2><p>按分级的联系节奏，距离上次聊过已经到期的人排在前面。</p></div>
      <div class="stats" id="due-stats"></div>
    </div>
    <div class="cadence" id="cadence">
      <span>联系节奏：</span>
      <label for="cad-A">A 级每</label><input id="cad-A" type="number" min="1" max="90" inputmode="numeric"><span>天</span>
      <label for="cad-B">· B 级每</label><input id="cad-B" type="number" min="1" max="90" inputmode="numeric"><span>天</span>
      <label for="cad-C">· C 级每</label><input id="cad-C" type="number" min="1" max="180" inputmode="numeric"><span>天</span>
      <span class="muted">· D 级不提醒</span>
    </div>
    <div id="due-body"><div class="skeleton">正在读取你的客户…</div></div>
  </section>

  <section class="view" id="view-contacts" aria-labelledby="tab-contacts" hidden>
    <div class="vhead">
      <div><h2>客户</h2><p>点任意一行看资料、记录和情报。</p></div>
      <button class="btn" type="button" id="btn-new-contact">＋ 新客户</button>
    </div>
    <div class="toolbar">
      <input type="search" id="c-q" placeholder="搜名字、公司、他能给什么…" aria-label="搜索客户">
      <div class="chips" id="c-tier" aria-label="分级"></div>
      <div class="chips" id="c-stage" aria-label="状态"></div>
      <select id="c-seg" aria-label="产业链位置"><option value="">全部产业链</option></select>
      <select id="c-rel" aria-label="关系类型"><option value="">全部关系</option></select>
      <span class="count" id="c-count"></span>
    </div>
    <div class="list" id="c-list"><div class="skeleton">正在读取…</div></div>
  </section>

  <section class="view" id="view-intel" aria-labelledby="tab-intel" hidden>
    <div class="vhead">
      <div><h2>情报</h2><p>每条价格、成交、排产和政策消息，带来源和日期，方便交叉核对。</p></div>
      <button class="btn" type="button" id="btn-new-intel">＋ 记一条情报</button>
    </div>
    <div class="toolbar">
      <input type="search" id="i-q" placeholder="搜内容或来源…" aria-label="搜索情报">
      <div class="chips" id="i-cat" aria-label="品类"></div>
      <span class="count" id="i-count"></span>
    </div>
    <div class="intel" id="i-list"><div class="skeleton">正在读取…</div></div>
  </section>
</main>

<button class="btn primary fab" type="button" id="btn-rec-fab">＋ 快速记录</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-h"><h3 id="sheet-title"></h3><button class="btn ghost" type="button" id="sheet-close" aria-label="关闭">关闭</button></div>
  <div class="sheet-b" id="sheet-body"></div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ---------- data layer: Supabase ---------- */
function createSupabaseApi(){
  const cfg = window.CRM_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) return null;
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const camel = o => { const r = {}; for (const k in o) r[k.replace(/_([a-z])/g, (_, c) => c.toUpperCase())] = o[k]; return r; };
  const snake = o => { const r = {}; for (const k in o) if (o[k] !== undefined) r[k.replace(/[A-Z]/g, c => "_" + c.toLowerCase())] = o[k]; return r; };
  const must = ({ data, error }) => { if (error) throw error; return data; };
  const strip = o => { const r = { ...o }; delete r.userId; delete r.user_id; return r; };
  const chunks = (a, n) => Array.from({ length: Math.ceil(a.length / n) }, (_, i) => a.slice(i * n, i * n + n));
  return {
    async session(){ return (await sb.auth.getSession()).data.session; },
    onAuth(fn){ sb.auth.onAuthStateChange((_e, s) => fn(s)); },
    async signIn(email, password){ const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
    async signUp(email, password){ const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) throw error; return !!data.session; },
    async signOut(){ await sb.auth.signOut(); },
    async loadAll(){
      const [c, l, i, s] = await Promise.all([
        sb.from("contacts").select("*").limit(1000),
        sb.from("logs").select("*").order("date", { ascending: false }).order("created_at", { ascending: false }).limit(1000),
        sb.from("intel").select("*").order("date", { ascending: false }).order("created_at", { ascending: false }).limit(1000),
        sb.from("settings").select("*").maybeSingle(),
      ]);
      return { contacts: must(c).map(camel), logs: must(l).map(camel), intel: must(i).map(camel), cadence: must(s)?.cadence || null };
    },
    async addLog(r){ must(await sb.from("logs").insert(snake(r))); },
    async addIntel(r){ must(await sb.from("intel").insert(snake(r))); },
    async insertContact(r){ must(await sb.from("contacts").insert(snake(r))); },
    async updateContact(id, patch){ must(await sb.from("contacts").update(snake(patch)).eq("id", id)); },
    async saveCadence(cad){ const s = await this.session(); must(await sb.from("settings").upsert({ user_id: s.user.id, cadence: cad, updated_at: new Date().toISOString() })); },
    async importData(file, progress){
      const contacts = (file.contacts || []).map(strip), logs = (file.logs || []).map(strip), intel = (file.intel || []).map(strip);
      let done = 0; const total = contacts.length + logs.length + intel.length;
      for (const part of chunks(contacts, 100)) { must(await sb.from("contacts").upsert(part.map(snake), { onConflict: "id" })); done += part.length; progress(done, total); }
      const logsWithId = logs.filter(r => r.id);
      for (const part of chunks(logsWithId, 200)) { must(await sb.from("logs").upsert(part.map(snake), { onConflict: "id" })); done += part.length; progress(done, total); }
      const intelWithId = intel.filter(r => r.id), intelNew = intel.filter(r => !r.id);
      for (const part of chunks(intelWithId, 200)) { must(await sb.from("intel").upsert(part.map(snake), { onConflict: "id" })); done += part.length; progress(done, total); }
      if (intelNew.length) {
        const { count } = await sb.from("intel").select("id", { count: "exact", head: true }).eq("source", "聊天导入");
        if (!count) for (const part of chunks(intelNew, 200)) { must(await sb.from("intel").insert(part.map(snake))); done += part.length; progress(done, total); }
      }
      return { contacts: contacts.length, logs: logsWithId.length, intel: intel.length };
    },
    async opener(prompt, signal){
      const s = await this.session();
      const r = await fetch(cfg.supabaseUrl.replace(/\/$/, "") + "/functions/v1/opener", {
        method: "POST", signal,
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.access_token, apikey: cfg.supabaseAnonKey },
        body: JSON.stringify({ prompt }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || d.message || ("开场白服务返回 " + r.status));
      return d.text;
    },
  };
}
</script>
<script>
(() => {
"use strict";
const TIERS = ["A","B","C","D"];
const STAGES = ["活跃","降温","沉睡","从未回复"];
const STAGE_C = {"活跃":"var(--good)","降温":"var(--warn)","沉睡":"var(--serious)","从未回复":"var(--none)"};
const CATS = ["NPI/镍铁","不锈钢","纯镍/LME","印尼政策/矿","MHP/高冰/新能源","废钢/铬","海外/贸易","其他"];
const SEGS = ["镍铁/NPI冶炼","新能源镍材料","不锈钢钢厂","国际贸易商/大宗供应链","不锈钢现货贸易/加工","海外钢厂/海外终端","废不锈钢/再生金属","物流/仓储","金融/投资/期货","资讯/咨询/数据同行","其他/未知"];
const RELS = ["核心信息源","观点交流伙伴","需求方","商务对接","私交化","被动接收者","未激活"];
const CHANNELS = ["微信","电话","见面"];
const DEFAULT_CAD = {A:3, B:7, C:30};

const API = window.CRM_TEST_API || createSupabaseApi();
const S = { contacts:new Map(), logs:[], intel:[], cad:{...DEFAULT_CAD}, loaded:false, view:"due", showC:false, user:null,
  cf:{q:"", tiers:new Set(), stages:new Set(), seg:"", rel:""}, inf:{q:"", cats:new Set()}, sheet:null };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((parse(a) - parse(b)) / 864e5);
const short = s => s ? String(s).slice(2,10).replace(/-/g,"/") : "—";

/* ---------- derived ---------- */
function lastTouch(c){ return c.lastTouch || c.lastTheir || null; }
function stage(c){ const l = lastTouch(c); if (!l) return "从未回复"; const d = diff(today(), l); return d <= 30 ? "活跃" : d <= 90 ? "降温" : "沉睡"; }
function dueDate(c){
  if (c.nextDue) return c.nextDue;
  if (c.tier === "D" || !S.cad[c.tier]) return null;
  const l = lastTouch(c); if (!l) return today();
  return addDays(l, Number(S.cad[c.tier]) || DEFAULT_CAD[c.tier]);
}
function dueChip(c){
  const d = dueDate(c); if (!d) return "";
  const n = diff(today(), d);
  if (n > 0) return `<span class="due over">超期 ${n} 天</span>`;
  if (n === 0) return `<span class="due today">今天</span>`;
  return `<span class="due soon">${-n} 天后</span>`;
}
const tierB = (t, sm) => `<span class="tier ${esc(t)}${sm?" sm":""}" aria-label="${esc(t)} 级">${esc(t)}</span>`;
const stageP = c => { const s = stage(c); return `<span class="pill"><i class="dot" style="background:${STAGE_C[s]}"></i>${s}</span>`; };
const nextText = c => c.nextNote || c.next || "";
const byId = id => S.contacts.get(id);
const logsOf = id => S.logs.filter(l => l.contactId === id);
const intelOf = id => S.intel.filter(i => i.contactId === id);

/* ---------- toast & banner ---------- */
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function banner(html){ const b = $("banner"); b.innerHTML = html; b.hidden = !html; }
function errText(e){
  const m = String(e && (e.message || e.error_description || e) || "");
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "网络连不上，检查一下网络再试。";
  if (/JWT|session|expired/i.test(m)) return "登录过期了，退出后重新登录。";
  return m ? "没保存上：" + m : "没保存上，稍后再试。";
}

/* ---------- data refresh ---------- */
async function refresh(){
  try {
    const d = await API.loadAll();
    S.contacts = new Map(d.contacts.map(c => [c.id, c]));
    S.logs = d.logs; S.intel = d.intel;
    if (d.cadence) S.cad = { A:+d.cadence.A||3, B:+d.cadence.B||7, C:+d.cadence.C||30 };
    S.loaded = true; banner(""); render();
  } catch (e) { banner(esc(errText(e)).replace("没保存上：","读取失败：")); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.user && !S.sheet) refresh(); });

/* ---------- views ---------- */
function setView(v){
  S.view = v;
  for (const k of ["due","contacts","intel"]) { $("view-"+k).hidden = k !== v; $("tab-"+k).setAttribute("aria-selected", String(k === v)); }
  try { localStorage.setItem("crm.view", v); } catch(_) {}
  render();
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));

function render(){
  renderBadge();
  if (S.view === "due") renderDue();
  if (S.view === "contacts") renderContacts();
  if (S.view === "intel") renderIntel();
  if (S.sheet && S.sheet.type === "detail") renderDetail(S.sheet.id);
}
function renderBadge(){
  const n = [...S.contacts.values()].filter(c => { const d = dueDate(c); return d && c.tier !== "C" && diff(today(), d) >= 0; }).length;
  const b = $("due-badge"); b.textContent = n; b.hidden = !S.loaded || n === 0;
}

/* ---------- 跟进 ---------- */
function renderDue(){
  for (const t of ["A","B","C"]) { const el = $("cad-"+t); if (document.activeElement !== el) el.value = S.cad[t]; }
  if (!S.loaded) return;
  const all = [...S.contacts.values()];
  if (!all.length) {
    $("due-stats").innerHTML = "";
    $("due-body").innerHTML = `<div class="empty"><p>还没有客户。到「设置」里导入 crm-seed.json，或者在「客户」里加第一位。</p><button class="btn primary" type="button" data-settings="1">去导入</button></div>`;
    return;
  }
  const t = today();
  const due = all.filter(c => { const d = dueDate(c); return d && diff(t, d) >= 0; })
    .sort((a,b) => (TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier)) || (diff(t, dueDate(b)) - diff(t, dueDate(a))));
  const soon = all.filter(c => { const d = dueDate(c); return d && diff(d, t) > 0 && diff(d, t) <= 7; })
    .sort((a,b) => dueDate(a).localeCompare(dueDate(b)));
  const doneWeek = new Set(S.logs.filter(l => l.date >= addDays(t, -6)).map(l => l.contactId)).size;
  const cnt = k => due.filter(c => c.tier === k).length;
  $("due-stats").innerHTML = [[cnt("A")+cnt("B"), "A/B 级到期"], [cnt("C"), "C 级到期"], [soon.length, "7 天内到期"], [doneWeek, "本周已记录的人"]]
    .map(([v,l]) => `<div class="stat"><span class="v">${v}</span><span class="l">${l}</span></div>`).join("");
  const card = c => `<article class="card">
      <div class="card-top">${tierB(c.tier)}<div class="who"><button class="linkish" type="button" data-open="${esc(c.id)}">${esc(c.name)}</button><span class="sub">${esc(c.company || "公司未填")}</span></div>${dueChip(c)}</div>
      <div class="sub">上次聊过 <span class="num">${short(lastTouch(c))}</span> · ${stageP(c)}${c.relation ? " · "+esc(c.relation) : ""}</div>
      ${nextText(c) ? `<p class="nx">${esc(nextText(c))}</p>` : ""}
      <div class="acts">
        <button class="btn sm" type="button" data-opener="${esc(c.id)}">写开场白</button>
        <button class="btn sm" type="button" data-log="${esc(c.id)}">记录</button>
        <button class="btn sm ghost" type="button" data-touch="${esc(c.id)}" title="今天聊过，不写详细记录">✓ 今天聊过</button>
      </div></article>`;
  const grp = (k, label) => {
    const L = due.filter(c => c.tier === k); if (!L.length) return "";
    const hide = k === "C" && !S.showC;
    return `<div class="group"><div class="group-h">${tierB(k)}<strong>${label}</strong><span>${L.length} 人到期</span>${k==="C" ? `<button class="btn sm ghost" type="button" id="toggle-c">${S.showC ? "收起" : "展开"}</button>` : ""}</div>${hide ? "" : `<div class="cards">${L.map(card).join("")}</div>`}</div>`;
  };
  let html = grp("A","核心客户") + grp("B","重要客户") + grp("C","培育中") + grp("D","你约过的 D 级");
  if (!due.length) html = `<div class="empty"><p>今天没有到期的人。下面是 7 天内要联系的。</p></div>`;
  if (soon.length) html += `<div class="group"><div class="group-h"><strong>7 天内到期</strong><span>${soon.length} 人</span></div><div class="soonlist">${
    soon.map(c => `<div class="soonrow">${tierB(c.tier,1)}<button class="linkish" type="button" data-open="${esc(c.id)}">${esc(c.name)}</button><span class="sub">${esc(c.company||"")}</span><span class="num muted" style="font-size:12px">${short(dueDate(c))}</span></div>`).join("")}</div></div>`;
  $("due-body").innerHTML = html;
  const tg = $("toggle-c"); if (tg) tg.onclick = () => { S.showC = !S.showC; renderDue(); };
}
let cadTimer;
for (const t of ["A","B","C"]) $("cad-"+t).addEventListener("input", () => {
  clearTimeout(cadTimer);
  cadTimer = setTimeout(async () => {
    const v = {}; for (const k of ["A","B","C"]) { const n = parseInt($("cad-"+k).value, 10); v[k] = n > 0 ? Math.min(n, 180) : DEFAULT_CAD[k]; }
    if (v.A === S.cad.A && v.B === S.cad.B && v.C === S.cad.C) return;
    S.cad = v; render();
    try { await API.saveCadence(v); toast("联系节奏已保存"); } catch (e) { toast(errText(e)); }
  }, 700);
});

/* ---------- 客户 ---------- */
function buildFilters(){
  $("c-tier").innerHTML = TIERS.map(t => `<button class="chip" type="button" aria-pressed="false" data-t="${t}" id="ct-${t}">${tierB(t,1)}${t} 级</button>`).join("");
  $("c-stage").innerHTML = STAGES.map(s => `<button class="chip" type="button" aria-pressed="false" data-s="${s}" id="cs-${s}"><i class="dot" style="background:${STAGE_C[s]}"></i>${s}</button>`).join("");
  SEGS.forEach(s => $("c-seg").add(new Option(s, s)));
  RELS.forEach(s => $("c-rel").add(new Option(s, s)));
  $("i-cat").innerHTML = CATS.map(c => `<button class="chip" type="button" aria-pressed="false" data-c="${c}" id="ic-${c}">${c}</button>`).join("");
  $("c-tier").onclick = e => { const b = e.target.closest("[data-t]"); if (b) { toggle(S.cf.tiers, b.dataset.t, b); renderContacts(); } };
  $("c-stage").onclick = e => { const b = e.target.closest("[data-s]"); if (b) { toggle(S.cf.stages, b.dataset.s, b); renderContacts(); } };
  $("i-cat").onclick = e => { const b = e.target.closest("[data-c]"); if (b) { toggle(S.inf.cats, b.dataset.c, b); renderIntel(); } };
  $("c-seg").onchange = e => { S.cf.seg = e.target.value; renderContacts(); };
  $("c-rel").onchange = e => { S.cf.rel = e.target.value; renderContacts(); };
  $("c-q").oninput = e => { S.cf.q = e.target.value.trim().toLowerCase(); renderContacts(); };
  $("i-q").oninput = e => { S.inf.q = e.target.value.trim().toLowerCase(); renderIntel(); };
}
function toggle(set, k, btn){ set.has(k) ? set.delete(k) : set.add(k); btn.setAttribute("aria-pressed", String(set.has(k))); }

function renderContacts(){
  if (!S.loaded) return;
  const f = S.cf;
  const L = [...S.contacts.values()].filter(c =>
    (!f.tiers.size || f.tiers.has(c.tier)) && (!f.stages.size || f.stages.has(stage(c))) &&
    (!f.seg || c.segment === f.seg) && (!f.rel || c.relation === f.rel) &&
    (!f.q || [c.name, c.wechatName, c.company, c.role, c.gives, c.wants, c.highlights, (c.topics||[]).join(" ")].join(" ").toLowerCase().includes(f.q))
  ).sort((a,b) => (TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier)) || String(lastTouch(b)||"").localeCompare(String(lastTouch(a)||"")));
  $("c-count").textContent = `${L.length} / ${S.contacts.size} 人`;
  if (!S.contacts.size) { $("c-list").innerHTML = `<div class="empty"><p>还没有客户。点「＋ 新客户」加第一位，或者到「设置」里导入。</p></div>`; return; }
  if (!L.length) { $("c-list").innerHTML = `<div class="empty"><p>没有符合条件的客户，换个筛选试试。</p></div>`; return; }
  $("c-list").innerHTML = `<div class="lhead" aria-hidden="true"><span></span><span>客户</span><span>公司</span><span>关系</span><span>状态</span><span class="r">上次聊过</span><span class="r">下次联系</span></div>` +
    L.map(c => `<button class="row" type="button" data-open="${esc(c.id)}">${tierB(c.tier)}<span class="nm">${esc(c.name)}</span><span class="meta"><span class="co">${esc(c.company || "—")}</span><span class="pill">${esc(c.relation||"")}</span>${stageP(c)}<span class="r num muted">${short(lastTouch(c))}</span><span class="r">${dueChip(c) || '<span class="muted" style="font-size:12px">不提醒</span>'}</span></span></button>`).join("");
}

/* ---------- 情报 ---------- */
function renderIntel(){
  if (!S.loaded) return;
  const f = S.inf;
  const L = S.intel.filter(i => (!f.cats.size || f.cats.has(i.category)) && (!f.q || [i.content, i.contactName, i.category].join(" ").toLowerCase().includes(f.q)));
  $("i-count").textContent = `${L.length} 条`;
  if (!S.intel.length) { $("i-list").innerHTML = `<div class="empty"><p>还没有情报。打完电话点「＋ 快速记录」，把拿到的价格或消息写进“拿到的情报”，就会出现在这里。</p></div>`; return; }
  if (!L.length) { $("i-list").innerHTML = `<div class="empty"><p>没有符合条件的情报。</p></div>`; return; }
  $("i-list").innerHTML = L.map(i => `<div class="irow"><span class="d">${esc(String(i.date||"").slice(0,10))}</span><span><span class="cat">${esc(i.category||"其他")}</span></span><span class="c">${esc(i.content)}</span><span class="s">${i.contactId && byId(i.contactId) ? `<button class="linkish" type="button" data-open="${esc(i.contactId)}">${esc(byId(i.contactId).name)}</button>` : `<span class="muted">${esc(i.contactName || "未注明来源")}</span>`}</span></div>`).join("");
}

/* ---------- sheet ---------- */
let lastFocus;
function openSheet(title, html, state){
  if (S.sheet && S.sheet.ctl) S.sheet.ctl.abort();
  if (!S.sheet) lastFocus = document.activeElement;
  S.sheet = state; $("sheet-title").textContent = title; $("sheet-body").innerHTML = html;
  $("sheet").hidden = false; $("scrim").hidden = false; $("sheet-body").scrollTop = 0;
  setTimeout(() => { const f = $("sheet-body").querySelector("[autofocus]") || $("sheet-close"); f && f.focus(); }, 30);
}
function closeSheet(){
  if (S.sheet && S.sheet.ctl) S.sheet.ctl.abort();
  S.sheet = null; $("sheet").hidden = true; $("scrim").hidden = true;
  lastFocus && lastFocus.focus && lastFocus.focus();
}
$("sheet-close").onclick = closeSheet; $("scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });

/* ---------- detail ---------- */
function openDetail(id){ const c = byId(id); if (!c) return; openSheet(c.name, "", {type:"detail", id}); renderDetail(id); }
function renderDetail(id){
  const c = byId(id); if (!c) { closeSheet(); return; }
  const op = S.sheet.opener;
  if (op && op.state === "busy") return;
  $("sheet-title").textContent = c.name;
  const sec = (l, v) => v && v !== "无" ? `<div class="sec"><span class="lbl">${l}</span><div class="val">${esc(v)}</div></div>` : "";
  const tl = [...logsOf(id).map(l => ({d:l.date, k:(l.channel||"记录"), t:[l.summary, l.next ? "下次："+l.next : ""].filter(Boolean).join("　")})),
              ...intelOf(id).map(i => ({d:i.date, k:"情报 · "+(i.category||""), t:i.content}))]
    .sort((a,b) => String(b.d).localeCompare(String(a.d)));
  const st = c.stats || {};
  $("sheet-body").innerHTML = `
    <div class="dhead">
      <div class="t">${tierB(c.tier)}<h2>${esc(c.name)}</h2></div>
      <div class="facts"><span>${esc(c.company || "公司未填")}</span>${c.role ? `<span>${esc(c.role)}</span>` : ""}<span>${esc(c.segment||"")}</span><span>${esc(c.relation||"")}</span></div>
      <div class="facts">${stageP(c)}<span>上次聊过 <span class="num">${esc(lastTouch(c) || "—")}</span></span>${dueChip(c)}${c.phone ? `<span>电话 <span class="copyable">${esc(c.phone)}</span></span>` : ""}</div>
    </div>
    <div class="acts">
      <button class="btn primary sm" type="button" data-opener="${esc(id)}">写开场白</button>
      <button class="btn sm" type="button" data-log="${esc(id)}">记录</button>
      <button class="btn sm" type="button" data-touch="${esc(id)}">✓ 今天聊过</button>

/* ---------- opener (OpenAI via Supabase Edge Function) ---------- */
function openerHTML(op){
  if (op.state === "busy") return `<div class="box"><p class="hint">正在写开场白…</p><div><button class="btn sm" type="button" id="op-stop">停止</button></div></div>`;
  if (op.state === "error") return `<div class="box"><p class="err">${esc(op.msg)}</p><div><button class="btn sm" type="button" data-opener="${esc(op.id)}">再试一次</button></div></div>`;
  if (op.state === "done") {
    const vs = op.text.split(/\n\s*-{3,}\s*\n/).map(s => s.trim()).filter(Boolean);
    return `<div class="box"><p class="hint">开场白 · 复制后按需改一改再发</p>${vs.map((v,k) => `<div class="ver"><span>${esc(v)}</span><button class="btn sm" type="button" data-copy="${k}">复制</button></div>`).join("")}<div><button class="btn sm ghost" type="button" data-opener="${esc(op.id)}">换一批</button></div></div>`;
  }
  return "";
}
function buildPrompt(c){
  const logs = logsOf(c.id).slice(0,4).map(l => `- ${String(l.date).slice(0,10)} ${l.channel||""}：${l.summary||""}${l.next ? "（下次："+l.next+"）" : ""}`).join("\n") || "（暂无记录）";
  const theirs = intelOf(c.id).slice(0,5).map(i => `- ${String(i.date).slice(0,10)} [${i.category}] ${i.content}`).join("\n") || "（暂无）";
  const market = S.intel.filter(i => i.contactId !== c.id).slice(0,8).map(i => `- ${String(i.date).slice(0,10)} [${i.category}] ${i.content}`).join("\n") || "（暂无）";
  return `你在帮 Bruce（周宗信）写一条发给客户的微信。Bruce 是上海有色网（SMM）马来西亚办公室的镍、高镍生铁（NPI）、不锈钢分析师，二十多岁，马来西亚华人。他的目标是从客户那里拿到一手市场信息，并且和客户成为朋友。

说话风格：短句、口语，自然地中英夹杂（cross check、FOB、CIF 这类词），常用“好滴”“嗯嗯”“确实”“哈哈哈”；按关系称呼X总、X哥、X姐；绝不用“尊敬的”“请问您”“冒昧打扰”这类客服腔；可以带一个表情如[抱拳][捂脸]。

开口原则：
1. 先亮牌再问：先给一条具体的信息（价格、成交、政策），再请对方确认或纠正。
2. 问判断，不问底价；让对方只需回“对/不对”或一个数字。
3. 接住上次聊的内容，让对方知道你记得。
4. 按对方岗位问他答得上的问题：采购问接受价，销售问报价和走货，仓库问出入库，贸易商问成交和客户情绪，研究员问观点。
5. 不要说出任何成交方、买卖方或信息来源的名字，不提公司内部资料。
6. 关系熟的可以带一句关心或闲聊，不要每次都只问价。

客户资料：
- 名字：${c.name}；公司：${c.company||"未知"}；角色：${c.role||"未知"}；产业链：${c.segment||""}；关系：${c.relation||""}；分级：${c.tier}
- 他能给的信息：${c.gives||"未知"}
- 他想要的：${c.wants||"未知"}
- 沟通提醒：${c.issues||"无"}
- 上次聊过：${lastTouch(c)||"从未"}；建议的下一步：${c.nextNote || c.next || "无"}

最近和他的记录：
${logs}

他之前给过的情报：
${theirs}

Bruce 手上最近的市场情报（可以拿来亮牌，只说内容，不提来源名字）：
${market}

今天是 ${today()}。写 2 个版本，每个不超过 3 行，可以直接复制发微信。两个版本之间用单独一行 --- 分隔。不要编号、引号或任何说明文字。`;
}
async function runOpener(id){
  const c = byId(id); if (!c) return;
  if (!S.sheet || S.sheet.type !== "detail" || S.sheet.id !== id) openDetail(id);
  S.sheet.ctl && S.sheet.ctl.abort();
  const ctl = new AbortController(); S.sheet.ctl = ctl;
  const op = {id, state:"busy"}; S.sheet.opener = op;
  $("opener-box").innerHTML = openerHTML(op);
  $("op-stop").onclick = () => ctl.abort();
  try { Object.assign(op, {state:"done", text: await API.opener(buildPrompt(c), ctl.signal)}); }
  catch (e) {
    if (e && e.name === "AbortError") Object.assign(op, {state:"none"});
    else Object.assign(op, {state:"error", msg: /fetch/i.test(String(e && e.message)) ? "连不上开场白服务。检查网络，或确认 Supabase 里已部署 opener 函数。" : String(e && e.message || "这次没写出来，稍后再试。")});
  }
  if (S.sheet && S.sheet.opener === op) { const box = $("opener-box"); if (box) box.innerHTML = openerHTML(op); }
}

async function onSession(s){
  S.user = s ? s.user : null;
  if (!s) { S.loaded = false; S.contacts = new Map(); S.logs = []; S.intel = []; closeSheet(); showGate("auth"); return; }
  showGate("app"); await refresh();
}

/* ---------- boot ---------- */
buildFilters();
try { const v = localStorage.getItem("crm.view"); if (v && ["due","contacts","intel"].includes(v)) S.view = v; } catch(_) {}
setView(S.view);
if (!API) { showGate("setup"); return; }
let seen = false;
const handle = s => {
  const id = (s && s.user && s.user.id) || null;
  if (seen && id === ((S.user && S.user.id) || null)) return;  // token refreshes and repeat events
  seen = true; onSession(s);
};
API.onAuth(handle);
API.session().then(handle);
})();
</script>
</body>
</html>
